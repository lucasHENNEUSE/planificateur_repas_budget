name: Integration Continue - Tests Eco-Frigo

on:
  push:
    branches:
      - main

jobs:
  tester_le_code:
    runs-on: ubuntu-latest

    # --- VALIDATION C19 : PARAMÉTRAGE DE L'ENVIRONNEMENT ---
    # Création d'une base de données MongoDB éphémère pour la CI
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27019:27017 # Relie le port attendu par l'API (27019) au port MongoDB natif (27017)

    steps:
      - name:  Récupérer le code source
        uses: actions/checkout@v3

      - name:  Installer Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name:  Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name:  Exécuter les tests automatisés (Pytest)
        # Injection de variables d'environnement factices pour remplacer le .env ignoré
        env:
          SECRET_KEY: "cle_secrete_virtuelle_ci"
          GEMINI_API_KEY: "fausse_cle_ia_pour_les_tests"
        run: pytest test_api.py -v
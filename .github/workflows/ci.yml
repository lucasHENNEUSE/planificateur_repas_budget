name: Integration Continue - Tests Eco-Frigo

# Les tests se lancent à chaque pull request vers main et à chaque fusion dans main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tester_le_code:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests automatisés et couverture
        # Variable factice : le vrai .env n'est jamais envoyé sur GitHub
        env:
          SECRET_KEY: "cle_secrete_virtuelle_ci"
        # Tous les tests, avec la couverture ; le CI échoue si elle passe sous 80 %
        run: python -m pytest --cov=api --cov=IA --cov=data --cov=monitoring --cov-fail-under=80 -v
